<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1120" viewBox="0 0 1440 1120" role="img" aria-labelledby="title desc">
  <title id="title">RIOSE ACT III execution architecture</title>
  <desc id="desc">The Product UI sends scenario changes to a browser Worker and Canvas renderer. The Product Worker uses the JavaScript FarmEngine. A local Node server may run native Rust configured comparisons, with JavaScript fallback. The separate lab app can opt into a Rust/WASM metabolism batch with JavaScript fallback. Explanations do not change simulation state. AMD compute is a separate vector service with CPU fallback and is not integrated into Product. Hosted deployment is unverified.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#547456"/></marker>
    <marker id="arrowMuted" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#87928a"/></marker>
    <style>
      text{font-family:Inter,Arial,sans-serif;fill:#202722}.title{font-size:34px;font-weight:700}.subtitle{font-size:16px;fill:#5c675f}.label{font-size:14px;font-weight:700;letter-spacing:1px;fill:#657068}.box-title{font-size:19px;font-weight:700}.box-title-sm{font-size:16px;font-weight:700}.box-copy{font-size:14px;fill:#425047}.small{font-size:12px;fill:#657068}.solid{stroke:#547456;stroke-width:3;fill:none;marker-end:url(#arrow)}.optional{stroke:#87928a;stroke-width:2.5;stroke-dasharray:8 7;fill:none;marker-end:url(#arrowMuted)}
    </style>
  </defs>
  <rect width="1440" height="1120" fill="#f5f6f1"/>
  <text x="64" y="66" class="title">RIOSE · ACT III execution architecture</text>
  <text x="64" y="96" class="subtitle">Current Product flow, with separate optional paths and unintegrated work shown explicitly.</text>

  <rect x="48" y="132" width="820" height="824" rx="22" fill="#fff" stroke="#d9dfd7" stroke-width="2"/>
  <text x="76" y="168" class="label">BROWSER · PRODUCT FLOW</text>
  <rect x="100" y="198" width="270" height="80" rx="14" fill="#edf4ec" stroke="#aebfac" stroke-width="2"/>
  <text x="124" y="230" class="box-title">User</text><text x="124" y="254" class="box-copy">asks or changes a supported scenario</text>
  <rect x="510" y="198" width="300" height="100" rx="14" fill="#edf4ec" stroke="#aebfac" stroke-width="2"/>
  <text x="534" y="228" class="box-title">Product UI + Canvas renderer</text><text x="534" y="253" class="box-copy">product.html · product-app.js</text><text x="534" y="277" class="small">product-scene.js · product-world-renderer.js</text>
  <path d="M370 238H500" class="solid"/>
  <rect x="510" y="342" width="300" height="96" rx="14" fill="#f6f7f4" stroke="#c9d1c8" stroke-width="2"/>
  <text x="534" y="374" class="box-title">Scenario &amp; lot configuration</text><text x="534" y="399" class="box-copy">housing · diet · climate · supplement</text><text x="534" y="421" class="small">Unsupported requests do not change model state.</text>
  <path d="M660 298V332" class="solid"/>
  <rect x="270" y="492" width="300" height="92" rx="14" fill="#edf4ec" stroke="#aebfac" stroke-width="2"/>
  <text x="294" y="526" class="box-title">Product Simulation Worker</text><text x="294" y="552" class="box-copy">state updates · ticks · comparisons</text>
  <path d="M550 438L490 482" class="solid"/>
  <rect x="270" y="646" width="300" height="110" rx="14" fill="#f6f7f4" stroke="#c9d1c8" stroke-width="2"/>
  <text x="294" y="680" class="box-title">JavaScript FarmEngine · default</text><text x="294" y="706" class="box-copy">simulation runs in browser Worker</text><text x="294" y="730" class="small">CPU path used by the captured Product flow.</text>
  <path d="M370 584V636" class="solid"/>
  <rect x="270" y="824" width="300" height="96" rx="14" fill="#edf4ec" stroke="#aebfac" stroke-width="2"/>
  <text x="294" y="858" class="box-title">Results · comparison · reporting</text><text x="294" y="884" class="box-copy">chart · modeled metrics · CSV / manifest</text>
  <path d="M420 756V814" class="solid"/>



  <rect x="918" y="132" width="474" height="824" rx="22" fill="#fff" stroke="#d9dfd7" stroke-width="2"/>
  <text x="946" y="168" class="label">OPTIONAL SERVICES / STATUS</text>
  <rect x="958" y="202" width="390" height="154" rx="14" fill="#f6f7f4" stroke="#c9d1c8" stroke-width="2"/>
  <text x="982" y="236" class="box-title-sm">Bundled Node server · lab only</text><text x="982" y="262" class="box-copy">/api/native/configured-comparison (loopback)</text><text x="982" y="286" class="box-copy">Native Rust runner when available.</text><text x="982" y="310" class="box-copy">Lab Worker uses JavaScript if unavailable or failed.</text><text x="982" y="337" class="small">Product comparison uses JS and makes no server call.</text>

  <rect x="958" y="384" width="390" height="104" rx="14" fill="#f6f7f4" stroke="#c9d1c8" stroke-width="2"/>
  <text x="982" y="418" class="box-title">Explanation · separate endpoint</text><text x="982" y="444" class="box-copy">Optional /api/explain; describes current state.</text><text x="982" y="468" class="small">It does not change simulation state or outputs.</text>
  <path d="M810 248C900 248 880 436 948 436" class="optional"/>
  <rect x="958" y="516" width="390" height="124" rx="14" fill="#f6f7f4" stroke="#c9d1c8" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="982" y="550" class="box-title-sm">Lab app · optional Rust / WASM</text><text x="982" y="576" class="box-copy">riose-core metabolism batch with ?engine=wasm.</text><text x="982" y="600" class="box-copy">JavaScript fallback; not wired into Product UI.</text><text x="982" y="624" class="small">src/client/app.js selects this path.</text>
  <rect x="958" y="668" width="390" height="142" rx="14" fill="#fff9ed" stroke="#e8c98b" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="982" y="702" class="box-title-sm">AMD integration · pending #137/#138</text><text x="982" y="728" class="box-copy">Separate experimental scale_vector service.</text><text x="982" y="752" class="box-copy">ROCm path with CPU fallback; no Product connection.</text><text x="982" y="780" class="small">No AMD execution or acceleration claim in this flow.</text>
  <rect x="958" y="838" width="390" height="92" rx="14" fill="#f6f7f4" stroke="#c9d1c8" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="982" y="872" class="box-title">Hosted deployment</text><text x="982" y="898" class="box-copy">Binding to this ACT III source SHA is unverified.</text><text x="982" y="920" class="small">Screenshots use local loopback only.</text>

  <rect x="48" y="984" width="1344" height="106" rx="20" fill="#e9eee7" stroke="#d0d8cf" stroke-width="2"/>
  <text x="76" y="1020" class="label">PATH KEY</text><path d="M180 1016H290" class="solid"/><text x="310" y="1021" class="box-copy">active Product path in current code</text><path d="M620 1016H730" class="optional"/><text x="750" y="1021" class="box-copy">optional, conditional, pending, or outside Product</text>
  <text x="76" y="1064" class="small">Product simulation defaults to browser JavaScript. WASM and native Rust are optional CPU paths; AMD is a separate, currently unintegrated compute service.</text>
  <text x="76" y="1083" class="small">Refs: src/client/product-app.js · src/client/worker.js · src/client/engine.js · src/server/server.js · src/server/compute_service.py</text>
</svg>
