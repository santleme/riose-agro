<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Riose · comparação de renderers rurais</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#dedccf;color:#20372e;font:14px system-ui,sans-serif}header{height:64px;display:flex;align-items:center;gap:14px;padding:10px 18px;background:#183c2f;color:#fff}h1{font-size:17px;margin:0 auto 0 0}label{display:flex;align-items:center;gap:6px}select,button{font:inherit;padding:6px 10px;border:1px solid #5c7567;border-radius:6px;background:#f5f3e8;color:#183c2f}button{cursor:pointer}#metrics{margin-left:auto;font-variant-numeric:tabular-nums}#viewport{position:relative;width:min(100vw,1536px);height:min(calc(100vh - 64px),960px);min-height:420px;margin:0 auto;overflow:hidden;background:#dedccf;touch-action:none}canvas{display:block;width:100%;height:100%;image-rendering:pixelated}#loading{position:absolute;inset:0;display:grid;place-items:center;color:#345b43;background:#dedccf;z-index:3}body.capture header{display:none}body.capture #viewport{width:1536px;height:960px;max-width:none;max-height:none}
  </style>
</head>
<body>
  <header>
    <a href="./index.html" style="color:#fff">← Graphics Lab</a>
    <h1>Mesmo mundo · comparação de renderer</h1>
    <label>Cena<select id="world"><option value="rural-small-v9">Piquete · 10 bovinos</option><option value="rural-property-v9">Propriedade · 20 bovinos</option></select></label>
    <label>Renderer<select id="renderer"><option value="pixi">PixiJS 8</option><option value="babylon">Babylon.js 9</option></select></label>
    <button id="measure">Medir 4 s</button>
    <span id="metrics">iniciando…</span>
  </header>
  <main id="viewport"><div id="loading">Carregando cena e atlases…</div></main>
  <script type="module" src="./dist/rural-renderer-lab.js"></script>
</body>
</html>
