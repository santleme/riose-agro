name: CI

on:
  pull_request:
    branches: [main, release/amd-act-iii]
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  javascript:
    name: JavaScript and WASM
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm

      - name: Set up Python for audit scripts
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-data-audit.txt

      - name: Set up Rust and the WASM target
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # pinned action revision
        with:
          toolchain: '1.95.0'
          targets: wasm32-unknown-unknown

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Install data-audit dependencies
        run: python -m pip install -r requirements-data-audit.txt

      - name: Build WASM from Rust sources
        run: npm run build:wasm

      - name: Check committed WASM artifact freshness
        run: git diff --exit-code -- wasm/riose_core.wasm

      - name: Run JavaScript tests
        run: npm test

      - name: Run deterministic scenario checks
        run: npm run test:scenarios

  python:
    name: Python unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Install optional scientific data and evaluation dependencies
        run: python -m pip install --requirement requirements-data-processing.txt

      - name: Run Python unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

  rust:
    name: Native Rust tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js for cross-engine trajectory parity
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # pinned action revision
        with:
          toolchain: '1.95.0'
          components: rustfmt

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Run Rust workspace tests
        run: cargo test --locked --workspace

      - name: Check isolated SIMD study equivalence and scalar fallback
        run: cargo test --locked --release -p riose-core --example simd_metabolism_study

      - name: Build native Rust workspace
        run: cargo build --locked --workspace --release

      - name: Compare complete JavaScript and native trajectories
        run: npm run test:parity

      - name: Measure native CLI and scenario timings
        env:
          NATIVE_CLI_PERF_RUNNER: ubuntu-24.04
        run: cargo run --locked --release -p riose-core --example native_cli_performance
